name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install deps
        run: pip install openpyxl==3.1.5 bottle==0.13.4
      - name: Configure git for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
      - name: Unit tests
        shell: pwsh
        run: |
          $output = & python -m unittest discover -s python/tests -v 2>&1
          $status = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($status -ne 0) {
            $diagnostic = $output | Where-Object {
              "$_" -match 'FAIL|ERROR|Traceback|AssertionError|FAILED|^Ran |^=+$|^-+$|File "'
            }
            $escaped = ($diagnostic -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Python unit tests failed::$escaped"
          }
          exit $status
      - name: Shim selfcheck
        run: node bin/xlmerge.js --selfcheck
